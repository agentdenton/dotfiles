- name: Provision workstation
  hosts: localhost
  connection: local

  roles:
    - { role: packages, become: true, tags: [packages]  }
    - { role: flathub,  become: true, tags: [flathub]   }
    - { role: system,   become: true, tags: [system]    }
    - { role: symlinks,               tags: [symlinks]  }
    - { role: fonts,                  tags: [fonts]     }
    - { role: user,     become: true, tags: [user]      }
    - { role: greetd,   become: true, tags: [greetd]    }
